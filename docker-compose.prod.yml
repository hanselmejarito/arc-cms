services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arc_clinic
    volumes:
      - arc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:4000"
    environment:
      DATABASE_URL: postgresql://arc:${POSTGRES_PASSWORD}@db:5432/arc_clinic
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      PORT: "4000"
      STATIC_DIR: /app/ui
    depends_on:
      db:
        condition: service_healthy

volumes:
  arc_pg:
