<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature Pad Test</title>
<style>body{font:16px system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#203044}p{line-height:1.5}canvas{display:block;width:100%;height:240px;border:2px solid #8797a7;border-radius:8px;touch-action:none;background:white;cursor:crosshair;box-sizing:border-box}.actions{display:flex;gap:10px;margin-top:16px}button{padding:10px 18px;border:1px solid #566d80;border-radius:6px;background:white;font:inherit;cursor:pointer}.primary{background:#145c80;color:white}.note{color:#526477}@media print{body{margin:20mm}.actions,.note{display:none}}</style></head><body>
<h1>Signature pad test</h1><p class="note">Test only. Use a sample signature; do not enter patient information. The signature stays on this page and is cleared when it is reloaded or closed.</p><p>Sign inside the box using the XP-Pen. Watch the computer screen as you write.</p><canvas id="pad" aria-label="Signature drawing area"></canvas><div class="actions"><button id="clear" type="button">Clear</button><button id="print" class="primary" type="button">Print / preview</button></div><p class="note" id="status" role="status">Ready for a test signature.</p>
<script>
const canvas=document.getElementById('pad'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let active=false,signed=false,last=null,pointer=null;
function resize(){const rect=canvas.getBoundingClientRect(),saved=signed?canvas.toDataURL():null,ratio=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#172334';if(saved){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=saved}}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(active||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();active=true;pointer=e.pointerId;signed=true;last=point(e);canvas.setPointerCapture(pointer);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+0.01,last.y+0.01);ctx.stroke();status.textContent='Sample signature ready. Clear it or open print preview.'});
canvas.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pointer)return;const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
function finish(e){if(e.pointerId!==pointer)return;active=false;last=null;pointer=null}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);signed=false;status.textContent='Cleared. Ready for another test signature.'};
document.getElementById('print').onclick=()=>{if(!signed){status.textContent='Please add a sample signature first.';return}window.print()};window.addEventListener('resize',resize);resize();
</script></body></html>
